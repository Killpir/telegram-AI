[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-ai-saas"
version = "1.0.0"
description = "Production-oriented Telegram AI SaaS backend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiogram>=3.30,<4.0",
    "alembic>=1.18,<2.0",
    "asyncpg>=0.30,<1.0",
    "celery[redis]>=5.6,<6.0",
    "fastapi>=0.128,<1.0",
    "httpx>=0.28,<1.0",
    "jinja2>=3.1,<4.0",
    "itsdangerous>=2.2,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "argon2-cffi>=25.1,<26.0",
    "pydantic-settings>=2.10,<3.0",
    "redis[hiredis]>=6.0,<7.0",
    "SQLAlchemy[asyncio]>=2.0.50,<2.2",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.2,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: requires real PostgreSQL and Redis"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
