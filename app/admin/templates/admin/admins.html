{% extends "admin/base.html" %}{% block content %}<div class="grid-2"><form method="post" class="card form-card"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><h2>Новый администратор</h2><label>Логин<input name="username" minlength="3" required></label><label>Пароль<input type="password" name="password" minlength="12" required autocomplete="new-password"></label><label>Роль<select name="role"><option value="admin">admin</option><option value="superadmin">superadmin</option></select></label><label>Telegram ID<input type="number" name="telegram_id"></label><button class="button primary">Создать</button></form><div class="card"><h2>Текущие</h2><div class="stack">{% for a in admins %}<div class="admin-row"><div><b>{{ a.username }}</b><br><small>{{ a.role }} · last login {{ a.last_login_at|dt }}</small></div><span class="badge {{ 'ok' if a.is_active else 'danger' }}">{{ 'active' if a.is_active else 'disabled' }}</span></div>{% endfor %}</div></div></div>{% endblock %}
