<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — Admin</title><link rel="stylesheet" href="/admin-static/admin.css"></head>
<body class="auth-body">
<div class="auth-card">
  <div class="brand auth-brand"><span class="brand-mark">AI</span><span>Telegram SaaS</span></div>
  <h1>Вход в админ-панель</h1>
  <p class="muted">Используйте отдельную учётную запись администратора.</p>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Логин<input name="username" autocomplete="username" required autofocus></label>
    <label>Пароль<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="button primary" type="submit">Войти</button>
  </form>
</div></body></html>
